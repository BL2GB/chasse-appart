name: crawl

on:
  # Toutes les 2 heures (UTC), à :17 pour éviter l'heure pile où GitHub retarde le plus.
  # GitHub peut retarder ou sauter un passage planifié : avec un passage toutes les 2 h, un raté
  # ne coûte que 2 h. Le robot relit tout quand le dernier passage complet date de plus de 20 h.
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "ids de sources à tester, séparés par des espaces (vide = toutes)"
        required: false
        default: ""
      full:
        description: "relire toutes les pages (sinon : nouveautés seulement)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install playwright==1.48.0 pyyaml==6.0.2
          python -m playwright install --with-deps chromium
      - name: Crawl
        env:
          FULL: ${{ github.event.inputs.full == 'true' && '1' || '0' }}
        run: python crawl.py ${{ github.event.inputs.only }}
      - name: Commit results
        run: |
          git config user.name "crawler-bot"
          git config user.email "crawler-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "crawl $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet || true
          git push
