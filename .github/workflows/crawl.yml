name: crawl

on:
  # PHASE DE TEST : planification désactivée, lancement manuel uniquement.
  # Pour activer 7h40 / 12h40 / 18h40 (heure de Genève en hiver), retirer les # :
  # schedule:
  #   - cron: "40 6,11,17 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "ids de sources séparés par des espaces (vide = toutes)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install playwright==1.48.0 pyyaml==6.0.2
          python -m playwright install --with-deps chromium
      - name: Crawl
        run: python crawl.py ${{ github.event.inputs.only }}
      - name: Commit results
        run: |
          git config user.name "crawler-bot"
          git config user.email "crawler-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "crawl $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
