# Sources relevées par le robot.
#
# url       : page de liste des locations (repérée à la main le 16.11.2026)
# discover  : true = on part de la page d'accueil et le robot cherche le lien « louer »
# max_pages : nombre max de pages de résultats suivies (défaut 25)
# niveau    : 1 = annonces lisibles dans la page ; 2 = chargées en JavaScript ;
#             3 = non lisibles par l'outil de lecture de Claude (à confirmer au test)
# page_param : pagination par paramètre d'URL (ex. ?page=2) quand il n'y a pas de lien « suivant »
# Retirés après le test du 16.11 : Coverim, Savioz (domaine inexistant), Forum (injoignable),
# Alain Bordier (renvoie vers Bordier & Schmidhauser), Simonin (= gerances.ch, déjà relevé).
# Le robot vérifie le robots.txt de chaque site à chaque passage et saute
# les pages interdites (statut « robots_disallow » dans data/run.json).

# Pré-filtre volontairement large : il n'écarte que ce qui ne peut pas être
# un logement compatible. Le vrai tri se fait selon les critères du tableau de bord.
prefiltre:
  pieces_min: 3.5        # « 3 pièces » ou moins sans mention de 3 chambres = écarté
  loyer_max: 6000        # loyer affiché au-dessus = écarté
  details_max_par_source: 40   # fiches détaillées lues par source et par passage

regies:
